[project]
name = "nexus"
version = "0.0.0"
description = "NEXUS — Personal AI Development Environment (Backend)"
readme = "../../README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "NEXUS Contributors"}
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.26",
    "psutil>=5.9",
    "watchdog>=3.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.26",
    "ruff>=0.2",
    "mypy>=1.8",
    "types-psutil>=5.9",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "PTH", "PD", "PGH", "PL"]
ignore = ["S101", "PTH123", "T201"]
fixable = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "PTH", "PD", "PGH", "PL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.alembic]
# Configured in alembic.ini

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"